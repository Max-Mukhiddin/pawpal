
services: 
  pawpal-api:
    container_name: pawpal-api
    restart: always
    image: node:24.19.0
    env_file:
      - .env
    ports:
      - 4001:3007
    volumes: 
      - ./:/usr/src/pawpal
    working_dir: /usr/src/pawpal

    networks:
      - monorepo_network

# For production
    command: bash -c "rm -rf dist && npm install && npm run build && npm run start:prod"



  pawpal-batch:
    container_name: pawpal-batch
    restart: unless-stopped
    image: node:24.19.0
    env_file:
      - .env
    ports:
      - 4002:3008
    volumes: 
      - ./:/usr/src/pawpal
    working_dir: /usr/src/pawpal

    networks:
      - monorepo_network

# For production
    command: bash -c "npm install && npm run build && npm run start:prod:batch"

networks:
  monorepo_network:
    driver: bridge